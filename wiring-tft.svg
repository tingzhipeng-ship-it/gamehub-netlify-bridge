<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1424"/><stop offset="1" stop-color="#182746"/></linearGradient><style>
.title{font:700 34px system-ui;fill:#f1f5ff}.sub{font:16px system-ui;fill:#9db0cf}.label{font:700 18px system-ui;fill:#eaf1ff}.small{font:15px system-ui;fill:#bac9e2}.pin{font:700 16px ui-monospace,monospace;fill:#fff}.card{fill:#15233a;stroke:#304968;stroke-width:2}.warn{fill:#482e27;stroke:#e9a45b;stroke-width:2}.warntext{font:15px system-ui;fill:#ffe0af}.wire{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
</style></defs><rect width="1280" height="900" fill="url(#bg)"/>
<text x="48" y="58" class="title">GameHub Mini · ILI9341 + XPT2046 touchscreen</text><text x="48" y="88" class="sub">Proposed ESP32-WROOM-32 SPI layout · verify the breakout labels, voltage and touch controller before wiring</text>
<rect x="48" y="140" width="330" height="600" rx="24" class="card"/><text x="85" y="184" class="label">ESP32-WROOM-32</text><rect x="145" y="215" width="140" height="115" rx="12" fill="#253955" stroke="#7890b4" stroke-width="2"/><text x="215" y="260" text-anchor="middle" class="label">ESP32</text><text x="215" y="288" text-anchor="middle" class="small">DevKit</text>
<g class="pin"><text x="80" y="380">GPIO18 SCK</text><text x="80" y="415">GPIO23 MOSI</text><text x="80" y="450">GPIO19 MISO</text><text x="80" y="485">GPIO5 TFT CS</text><text x="80" y="520">GPIO2 DC</text><text x="80" y="555">GPIO4 RESET</text><text x="80" y="590">GPIO22 BACKLIGHT</text><text x="80" y="625">GPIO21 TOUCH CS</text><text x="80" y="660">GPIO39 TOUCH IRQ*</text><text x="80" y="695">GPIO34 BATTERY</text></g>
<rect x="470" y="145" width="740" height="300" rx="22" class="card"/><text x="510" y="188" class="label">2.8-inch ILI9341 TFT (320×240)</text><rect x="650" y="215" width="400" height="185" rx="14" fill="#050b15" stroke="#5688bf" stroke-width="3"/><rect x="675" y="238" width="350" height="138" rx="7" fill="#102c45"/><text x="850" y="300" text-anchor="middle" font-size="30" font-family="monospace" fill="#58d8c7">GAMEHUB</text><text x="850" y="335" text-anchor="middle" font-size="16" font-family="monospace" fill="#a6c9ef">ILI9341 · 320×240</text><text x="510" y="430" class="small">SCK18 · MOSI23 · MISO19 · CS5 · DC2 · RST4 · BL22</text>
<rect x="470" y="475" width="350" height="145" rx="18" class="card"/><text x="505" y="515" class="label">XPT2046 touch controller</text><text x="505" y="550" class="small">T_CS → GPIO21</text><text x="505" y="578" class="small">T_IRQ → GPIO39 (optional)</text><text x="505" y="606" class="small">Shares SPI clock/data with TFT</text>
<rect x="850" y="475" width="360" height="145" rx="18" class="card"/><text x="885" y="515" class="label">Analog 1S battery reader</text><text x="885" y="550" class="small">OUT → GPIO34</text><text x="885" y="578" class="small">GND → common ground</text><text x="885" y="606" class="small">Calibrate divider; input ≤3.3V</text>
<rect x="48" y="765" width="1162" height="92" rx="16" class="card"/><text x="80" y="800" class="label">Physical buttons</text><text x="80" y="832" class="small">UP32 · DOWN33 · LEFT25 · RIGHT26 · A27 · B14 · START35 · SELECT36 · buzzer GPIO13</text>
<rect x="840" y="645" width="370" height="95" rx="16" class="warn"/><text x="868" y="680" class="label">GPIO35 / GPIO36</text><text x="868" y="710" class="warntext">Input-only: add external 10k pull-ups to 3V3.</text>
<text x="48" y="885" class="sub">*Touch IRQ is optional; if not wired, firmware uses touch pressure samples. Calibrate TOUCH_X/Y limits, swap and invert settings if axes are rotated.</text>
</svg>
